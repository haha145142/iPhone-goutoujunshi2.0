name: Original Jev v2 UI + Real 666 Skill + Context
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: haha145142/jev-chat-jarvis-ios
          ref: fe0fc6dd72b5f3b893dab0033c73b477112b1aeb
          path: original
      - uses: actions/checkout@v4
        with:
          repository: haha145142/JevJarvis-liuhai-IOS
          ref: 4b4080da66eee25793af98f66bd6801d0bd4ed51
          path: v2source
      - uses: actions/checkout@v4
        with:
          repository: haha145142/goutou-keyboard-ios
          ref: 898ce8358020b9eeb2bd5167863869d1ad1f3d86
          path: skill666
      - uses: actions/checkout@v4
        with:
          repository: hotcoffeeshake/tong-jincheng-skill
          ref: c9caaa9a6576f581c29d016c60bbe935908e20d5
          path: tong
      - name: Restore 666 skill and v2 knowledge resources
        run: |
          mkdir -p original/KnowledgeLibrary/tong
          cp -R original/GoutouKnowledge/practical original/KnowledgeLibrary/practical
          cp tong/SKILL.md 'original/KnowledgeLibrary/tong/00-童锦程核心方法.md'
          cp tong/references/research/*.md original/KnowledgeLibrary/tong/
          cp skill666/Keyboard/GoutouSkill.md original/Keyboard/GoutouSkill.md
          test "$(find original/KnowledgeLibrary/practical -name '*.md' | wc -l | tr -d ' ')" -eq 23
          test "$(find original/KnowledgeLibrary/tong -name '*.md' | wc -l | tr -d ' ')" -eq 7
      - name: Patch real JevDraft and auto context, without replacing keyboard UI
        run: python3 patches/v2_real_skill.py
      - name: Smoke test live Skill extraction and JevContext persistence
        run: |
          swiftc -o /tmp/jev_smoke original/Shared/JevContext.swift original/Shared/GoutouSkillFusion.swift tests/V2SkillContextSmoke.swift
          /tmp/jev_smoke original/Keyboard/GoutouSkill.md
          grep -F 'GoutouSkillFusion.rules' original/Shared/JevDraft.swift
          grep -F 'JevContextStore.shared.append(.them, text: message)' original/Keyboard/Sources/KeyboardViewController.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        working-directory: original
        run: xcodegen generate
      - name: Compile iPhone Release (unsigned)
        working-directory: original
        run: xcodebuild -project JevJarvis.xcodeproj -scheme JevJarvis -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
      - name: Validate app and keyboard
        run: |
          APP="original/build/Build/Products/Release-iphoneos/JevJarvis.app"
          EXT="$APP/PlugIns/JevKeyboard.appex"
          test -f "$APP/JevJarvis"
          test -f "$EXT/JevKeyboard"
          test -f "$EXT/GoutouSkill.md"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -Fx 'com.apple.keyboard-service'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:PrimaryLanguage' "$EXT/Info.plist" | grep -Fx 'en-US'
          test "$(find "$APP/KnowledgeLibrary/practical" -name '*.md' | wc -l | tr -d ' ')" -eq 23
          test "$(find "$APP/KnowledgeLibrary/tong" -name '*.md' | wc -l | tr -d ' ')" -eq 7
      - name: Create unsigned IPA
        run: |
          mkdir Payload
          cp -R original/build/Build/Products/Release-iphoneos/JevJarvis.app Payload/
          zip -qr Jev-v2-Real666-Context-unsigned.ipa Payload
      - name: Inspect compressed IPA for missing features
        run: |
          python3 - <<'PY'
          import zipfile,plistlib
          f="Jev-v2-Real666-Context-unsigned.ipa"
          with zipfile.ZipFile(f) as z:
              assert z.testzip() is None
              names=z.namelist()
              base="Payload/JevJarvis.app/"
              ext=plistlib.loads(z.read(base+"PlugIns/JevKeyboard.appex/Info.plist"))
              assert ext["NSExtension"]["NSExtensionAttributes"]["PrimaryLanguage"]=="en-US"
              assert len(z.read(base+"PlugIns/JevKeyboard.appex/GoutouSkill.md"))>1000
              assert len([n for n in names if n.startswith(base+"KnowledgeLibrary/practical/") and n.endswith(".md")])==23
              assert len([n for n in names if n.startswith(base+"KnowledgeLibrary/tong/") and n.endswith(".md")])==7
              print("FINAL_IPA_VALIDATED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Jev-v2-Real666-Context-unsigned-IPA
          path: Jev-v2-Real666-Context-unsigned.ipa
          retention-days: 30
