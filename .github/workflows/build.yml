name: Jev v2 Clipboard Crash Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Jev v2 UI code
        uses: actions/checkout@v4
        with:
          repository: haha145142/JevJarvis-liuhai-IOS
          ref: 4b4080da66eee25793af98f66bd6801d0bd4ed51
          path: original
      - name: Apply clipboard and crash trace fixes
        run: python3 patches/crashfix.py
      - name: Restore practical knowledge resources to host App only
        run: |
          mkdir -p original/KnowledgeLibrary
          cp -R original/Resources/GoutouKnowledge/practical original/KnowledgeLibrary/practical
          test "$(find original/KnowledgeLibrary/practical -type f -name '*.md' | wc -l | tr -d ' ')" -eq 23
      - name: Test message parsing and prompt memory before packaging
        run: |
          swiftc -o /tmp/goutou_fusion_smoke original/Shared/GoutouBrain.swift original/Shared/GoutouSegmentBuilder.swift original/Keyboard/Sources/GoutouStableMemory.swift tests/FusionSmoke.swift
          /tmp/goutou_fusion_smoke
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: original
        run: xcodegen generate
      - name: Compile iPhone release
        working-directory: original
        run: xcodebuild -project JevJarvis.xcodeproj -scheme JevJarvis -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Validate keyboard payload
        run: |
          APP="original/build/Build/Products/Release-iphoneos/JevJarvis.app"
          EXT="$APP/PlugIns/JevKeyboard.appex"
          test -f "$APP/JevJarvis"
          test -f "$EXT/JevKeyboard"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -Fx com.apple.keyboard-service
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:PrimaryLanguage' "$EXT/Info.plist" | grep -Fx en-US
          test -f "$EXT/GoutouSkill.md"
          test -d "$APP/KnowledgeLibrary/practical"
          test "$(find "$APP/KnowledgeLibrary/practical" -type f -name '*.md' | wc -l | tr -d ' ')" -eq 23
          test "$(stat -f%z "$EXT/GoutouSkill.md")" -gt 4000
          echo "PAYLOAD_VALIDATION_PASS: 23 App knowledge docs, 5 KB skill, main executable and keyboard"
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R original/build/Build/Products/Release-iphoneos/JevJarvis.app Payload/
          zip -qr Jev-v2-Clipboard-CrashFix-unsigned.ipa Payload
      - name: Inspect final IPA zip, identity and resources
        run: |
          python3 - <<'PY'
          import zipfile, plistlib, os
          path="Jev-v2-Clipboard-CrashFix-unsigned.ipa"
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names=z.namelist()
              root="Payload/JevJarvis.app/"
              app=plistlib.loads(z.read(root+"Info.plist"))
              ext=plistlib.loads(z.read(root+"PlugIns/JevKeyboard.appex/Info.plist"))
              assert app["CFBundleIdentifier"] == "com.jevchat.jarvis"
              assert ext["CFBundleIdentifier"] == "com.jevchat.jarvis.keyboard"
              assert ext["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.keyboard-service"
              assert ext["NSExtension"]["NSExtensionAttributes"]["PrimaryLanguage"] == "en-US"
              guides=[n for n in names if n.startswith(root+"KnowledgeLibrary/practical/") and n.endswith(".md")]
              assert len(guides)==23, f"Missing App resources: {len(guides)}"
              assert len(z.read(root+"PlugIns/JevKeyboard.appex/GoutouSkill.md"))>4000
              print("FINAL_IPA_PASS",os.path.getsize(path),"bytes","practical guides:",len(guides))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Jev-v2-Clipboard-CrashFix-unsigned-IPA
          path: Jev-v2-Clipboard-CrashFix-unsigned.ipa
          retention-days: 30
