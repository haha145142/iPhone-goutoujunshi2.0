name: Jev v2 Clipboard Crash Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Jev v2 UI code
        uses: actions/checkout@v4
        with:
          repository: haha145142/JevJarvis-liuhai-IOS
          ref: 4b4080da66eee25793af98f66bd6801d0bd4ed51
          path: original
      - name: Apply clipboard and crash trace fixes
        run: python3 patches/crashfix.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: original
        run: xcodegen generate
      - name: Compile iPhone release
        working-directory: original
        run: xcodebuild -project JevJarvis.xcodeproj -scheme JevJarvis -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Validate keyboard payload
        run: |
          APP="original/build/Build/Products/Release-iphoneos/JevJarvis.app"
          EXT="$APP/PlugIns/JevKeyboard.appex"
          test -f "$APP/JevJarvis"
          test -f "$EXT/JevKeyboard"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -Fx com.apple.keyboard-service
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:PrimaryLanguage' "$EXT/Info.plist" | grep -Fx en-US
          test -f "$EXT/GoutouSkill.md"
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R original/build/Build/Products/Release-iphoneos/JevJarvis.app Payload/
          zip -qr Jev-v2-Clipboard-CrashFix-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Jev-v2-Clipboard-CrashFix-unsigned-IPA
          path: Jev-v2-Clipboard-CrashFix-unsigned.ipa
          retention-days: 30
