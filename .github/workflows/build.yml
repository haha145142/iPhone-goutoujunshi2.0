name: Build Original UI × 666 Human Replies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original Jev iOS code
        uses: actions/checkout@v4
        with:
          repository: haha145142/jev-chat-jarvis-ios
          path: original
      - name: Integrate human replies and memory fixes
        run: python3 patches/original_666.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: original
        run: xcodegen generate
      - name: Build iOS
        working-directory: original
        run: xcodebuild -project JevJarvis.xcodeproj -scheme JevJarvis -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Validate original keyboard and resources
        run: |
          APP="original/build/Build/Products/Release-iphoneos/JevJarvis.app"
          EXT="$APP/PlugIns/JevKeyboard.appex"
          test -f "$APP/JevJarvis"
          test -f "$EXT/JevKeyboard"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -Fx com.apple.keyboard-service
          find "$EXT" -type f -name '*.md' | head -6
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R original/build/Build/Products/Release-iphoneos/JevJarvis.app Payload/
          zip -qr Goutou-Original-UI-HumanReply-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Goutou-Original-UI-HumanReply-IPA
          path: Goutou-Original-UI-HumanReply-unsigned.ipa
          retention-days: 30
