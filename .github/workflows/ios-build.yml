name: Unsigned iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iPhone app
        run: |
          xcodebuild -project JevKeyboard2.xcodeproj -scheme JevKeyboard2 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Validate keyboard extension metadata
        run: |
          EXT=build/Build/Products/Release-iphoneos/JevKeyboard2.app/PlugIns/JevKeyboardExtension.appex/Info.plist
          test -f "$EXT"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT" | grep -Fx 'com.apple.keyboard-service'
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JevKeyboard2.app Payload/
          zip -qr JevKeyboard2-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JevKeyboard2-unsigned-IPA
          path: JevKeyboard2-unsigned.ipa
          retention-days: 30
