name: Standalone IPA (single app)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate standalone project
        run: xcodegen generate --spec project-standalone.yml
      - name: Build unsigned standalone
        run: |
          xcodebuild -project GoutouStandalone.xcodeproj -scheme GoutouStandalone -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-standalone CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Validate single-app IPA payload
        run: |
          test -f build-standalone/Build/Products/Release-iphoneos/GoutouStandalone.app/Info.plist
          test ! -d build-standalone/Build/Products/Release-iphoneos/GoutouStandalone.app/PlugIns
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build-standalone/Build/Products/Release-iphoneos/GoutouStandalone.app/Info.plist | grep -Fx com.4OXM.B3xQO
      - name: Package standalone IPA
        run: |
          mkdir -p Payload
          cp -R build-standalone/Build/Products/Release-iphoneos/GoutouStandalone.app Payload/
          zip -qr GoutouStandalone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GoutouStandalone-single-app-unsigned-IPA
          path: GoutouStandalone-unsigned.ipa
          retention-days: 30
