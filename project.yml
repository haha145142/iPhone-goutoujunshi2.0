name: JevKeyboard2
options:
  bundleIdPrefix: com.jev
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  JevKeyboard2:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jev.keyboard2
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: 狗头军师
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: JevKeyboardExtension
        embed: true
  JevKeyboardExtension:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jev.keyboard2.extension
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
